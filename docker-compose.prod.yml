# Production stack for Dokploy / VPS.
# Dev stack: docker-compose.yml
#
# RAM: минимум 4 GB (Dokploy + этот стек). На 3 GB — swap 2 GB обязателен.
# Dokploy: Compose Type → Git → Compose path: docker-compose.prod.yml
# Domain: service nginx, port 80

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-content_platform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-content_platform}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    env_file: .env
    volumes:
      - telethon_session:/app/telethon_sessions
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8000/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Тяжёлые AI-задачи (рерайт новостей, генерация статей): DeepSeek + веб-ресёрч
  # + картинки, минуты на задачу. Серийно (concurrency=1) — сохраняет
  # rate-limit DeepSeek (1 req/sec на процесс) и не даёт AI-вызовам конкурировать.
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SKIP_MIGRATIONS: "1"
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1 -Q ai --hostname=worker-ai@%h
    env_file: .env
    volumes:
      - telethon_session:/app/telethon_sessions
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy

  # Быстрые задачи (публикация, парсинг источников, статистика, ретеншн,
  # тик планировщика) — секунды на задачу. Отдельный воркер, чтобы они не
  # ждали за долгой AI-генерацией в celery_worker.
  celery_worker_fast:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SKIP_MIGRATIONS: "1"
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 -Q celery --hostname=worker-fast@%h
    env_file: .env
    volumes:
      - telethon_session:/app/telethon_sessions
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SKIP_MIGRATIONS: "1"
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    # Порты не пробрасываем — доступ через Dokploy Domains (Traefik → nginx:80).
    # Для отладки без домена раскомментируйте:
    # ports:
    #   - "8080:80"

volumes:
  postgres_data:
  redis_data:
  telethon_session:
  media_data:
